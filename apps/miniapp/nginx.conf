# apps/miniapp/nginx.conf — конфиг nginx для Mini App static.
# Реализует E2 ERRATA: CSP default-src 'self' + whitelist, unsafe-eval запрещён.
# Правило: Mini App работает только внутри Telegram web/mobile.
#
# ЕДИНЫЙ ORIGIN: статика Mini App и API отдаются с одного origin
# (внутри контейнера nginx слушает 80, на хосте — 127.0.0.1:5173).
# Будущий внешний HTTPS-вход (выбор — за Автором) смотрит только на 127.0.0.1:5173.
#   /miniapp/v1/**        → api:8080 (контракт build/miniapp-api-contract.yaml)
#   /security/csp-report  → api:8080 (report-uri CSP E2)
#   /miniapp/ (и прочее под /miniapp/*, кроме v1) → 404 (правило IRONCLAD)
# Поэтому клиенту достаточно относительных путей и connect-src 'self' (E2 не ослаблен).

# ------------------------------------------------------------
# Upstream api резолвится В МОМЕНТ ЗАПРОСА, а не при старте nginx.
# Если написать proxy_pass http://api:8080 литералом, nginx резолвит имя при
# загрузке конфига и падает с «host not found in upstream», когда контейнера api
# ещё/уже нет в сети. С переменной + resolver nginx стартует всегда, а пока api
# недоступен — отвечает 502 только на /miniapp/v1/** и /security/csp-report.
# 127.0.0.11 — встроенный DNS Docker (есть в user-defined сети course-bot_net).
# valid=10s — IP api перечитывается после пересоздания контейнера.
# ipv6=off — сеть compose без IPv6, AAAA-запросы не нужны.
# Имя api и порт 8080 — сервис compose и фиксированный порт CMD uvicorn
# (см. APP_PORT в .env.example — «Не менять»).
# ------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# X-Forwarded-Proto: если перед nginx стоит внешний HTTPS-вход, он терминирует TLS
# и сам присылает X-Forwarded-Proto: https — сохраняем его. Иначе — собственная схема.
# Доверять заголовку допустимо: nginx опубликован только на 127.0.0.1 (правило IRONCLAD).
map $http_x_forwarded_proto $course_bot_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # CSP (Content Security Policy) — E2 ERRATA, обязательная норма.
    # Источник значений: normative/errata-unified.md → E2_csp_default_src.csp_final
    # (высшая ступень старшинства; OVERRIDES.yaml id=E2).
    #   default-src 'self'                      — только свой origin по умолчанию;
    #   script-src  'self' https://telegram.org — официальный telegram-web-app.js (Б14 R372);
    #   style-src   'self' 'unsafe-inline'      — разрешено E2;
    #   img-src     'self' data: blob:          — галереи фото (blob:);
    #   connect-src 'self'                      — API на том же origin;
    #   frame-ancestors — только Telegram (web.telegram.org, telegram.org);
    #   report-uri /security/csp-report         — приёмник в apps/api;
    #   unsafe-eval — ЗАПРЕЩЁН (INV-B14-CSP-STRICT).
    # font-src / base-uri / form-action / object-src — не ослабляют E2 (ужесточение).
    #
    # ПЛЕЙСХОЛДЕР-ШЛЮЗ (ERRATA, раздел 6): E2 добавляет https://{s3-domain-ru}
    # в img-src и connect-src. Домен не выбран (решение Автора) → НЕ подставлен:
    # CSP с незаменённым плейсхолдером не проходит валидацию. S3 клиенту нужен
    # только с Итерации 5 (pre-signed URL); до прода — boot-gate.
    # ============================================================
    # Одна строка: многострочное значение уходило в ответ с сырыми переводами строк
    # (obs-fold, RFC 9112 §5.2) — строгие HTTP-парсеры отвергают такой заголовок.
    # Директивы — те же, что перечислены выше; политика не менялась.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors https://web.telegram.org https://telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /security/csp-report;" always;

    # Прочие заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS включается ТОЛЬКО в prod, когда есть реальный HTTPS через Cloudflare.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Статика с длинным кешем (хешированные имена от Vite).
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------- Прокси в api (единый origin) ----------------
    # Переменная в proxy_pass → runtime-резолв через resolver (см. шапку файла).
    # proxy_pass без URI-части → путь запроса уходит в api без изменений.
    set $course_bot_api http://api:8080;

    # API Mini App по контракту: /miniapp/v1/**.
    # ^~ — регулярные location (статика *.js и т.п.) сюда не вмешиваются.
    location ^~ /miniapp/v1/ {
        proxy_pass $course_bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $course_bot_forwarded_proto;
        # Заголовки контракта — явно (nginx и так их передаёт, но так видно намерение).
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_set_header X-Client-Op-Id       $http_x_client_op_id;
    }

    # report-uri CSP (E2). Без initData (security: [] в контракте).
    # 16k — столько же api логирует (MAX_REPORT_BYTES); больше не принимаем.
    location = /security/csp-report {
        client_max_body_size 16k;
        proxy_pass $course_bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $course_bot_forwarded_proto;
    }

    # Правило IRONCLAD (SERVER-IRONCLAD.md, «Крон-окна»): путь /miniapp/ занят
    # keep-alive мониторингом — на голом /miniapp/ НЕ отдаём 200.
    location = /miniapp/ {
        return 404;
    }

    # Прочее под /miniapp/* (кроме /miniapp/v1/**) — не статика Mini App и не API.
    location ^~ /miniapp/ {
        return 404;
    }

    # SPA-роутинг: любой путь возвращает index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck для Docker.
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Логи в stdout/stderr — читаются через docker compose logs.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
