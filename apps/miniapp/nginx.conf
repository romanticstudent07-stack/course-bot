# apps/miniapp/nginx.conf — конфиг nginx для Mini App static.
# Реализует E2 ERRATA: CSP default-src 'self' + whitelist, unsafe-eval запрещён.
# Правило: Mini App работает только внутри Telegram web/mobile.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # CSP (Content Security Policy) — E2 ERRATA, обязательная норма.
    # default-src 'self' — только свой origin для всех ресурсов по умолчанию.
    # script-src добавляет Telegram-домены (нужны для @telegram-apps/sdk-react).
    # unsafe-eval — ЗАПРЕЩЁН. unsafe-inline — только для inline-стилей Vite build.
    # frame-ancestors — только Telegram (Mini App открывается в iframe TG-клиента).
    # ============================================================
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' https://telegram.org https://t.me https://web.telegram.org;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https: blob:;
        font-src 'self' data:;
        connect-src 'self' https://telegram.org wss://telegram.org;
        frame-ancestors https://web.telegram.org https://t.me;
        base-uri 'self';
        form-action 'self';
        object-src 'none';
    " always;

    # Прочие заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS включается ТОЛЬКО в prod, когда есть реальный HTTPS через Cloudflare.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Статика с длинным кешем (хешированные имена от Vite).
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA-роутинг: любой путь возвращает index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck для Docker.
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Логи в stdout/stderr — читаются через docker compose logs.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
