# apps/api/migrations/alembic.ini — конфиг Alembic.
# Реальный DSN подставляется в env.py из переменных окружения (не хардкодить).

[alembic]
# Путь к скриптам миграций относительно этого файла.
script_location = .

# Форматы имён генерируемых файлов миграций.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Дефолтный URL БД — ПУСТОЙ. Реальный берём из env.py через переменные окружения.
sqlalchemy.url =

# Точки в именах ревизий разделяются подчёркиванием.
truncate_slug_length = 40

# Не запускать миграции с пустым сообщением.
revision_environment = false

[post_write_hooks]
# Опциональные post-hooks (например, black для форматирования).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
