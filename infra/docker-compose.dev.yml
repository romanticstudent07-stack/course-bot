# infra/docker-compose.dev.yml
# Локальный контур разработки на сервере IRONCLAD (Ubuntu 26.04, bare-metal).
# Правила сервера:
#   - все порты биндятся на 127.0.0.1 (наружу — только Cloudflare Tunnel).
#   - у всех контейнеров задан лимит памяти (переменные MEM_LIMIT_* в .env).
#   - префикс проекта course-bot — не пересекается с maxmover_default.
#   - shared_buffers Postgres ≤ 256 MB (правило хоста).
# НЕ для прода: в проде PostgreSQL с PITR и S3 у РФ-провайдера (Yandex Object Storage).
#
# S3-совместимое хранилище — Garage (dxflrs/garage:v2.3.0), заменил MinIO
# (MinIO удалил официальные Docker-образы в сентябре 2026).
# Переезд на Yandex Object Storage — просто смена S3_ENDPOINT, код не меняется.
#
# ВАЖНО:
#   - Образ dxflrs/garage собран from scratch — в нём нет /bin/sh.
#     Поэтому healthcheck — только exec-форма ["CMD", "/garage", ...].
#   - Флаги --single-node и --default-bucket автоматически создают
#     кластер из одного узла и первый бакет (photos) из переменных
#     GARAGE_DEFAULT_* — init-контейнер не нужен.
#   - Второй бакет (audit) создаётся вручную одной командой при переходе
#     к Итерации 5 (см. infra/README.md, раздел "Создание бакета audit").

name: course-bot

services:
  db:
    image: postgres:16
    container_name: course-bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    command: >
      postgres -c wal_level=replica
               -c archive_mode=on
               -c max_wal_senders=3
               -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-384M}

  redis:
    image: redis:7-alpine
    container_name: course-bot_redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_REDIS:-64M}

  # S3-совместимое хранилище (замена MinIO).
  # Garage — Rust, крошечный (~30 MB RAM), актуальный (dxflrs/garage:v2.3.0).
  # Конфиг: infra/garage/garage.toml (примонтирован read-only).
  # Порты Garage: 3900 (S3 API), 3901 (RPC), 3902 (s3_web — раздача статики, НЕ админка), 3903 (Admin API).
  # Наружу публикуем как 9000/9001, чтобы схема портов в .env не менялась.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: course-bot_garage
    # --single-node: один узел без реплик; --default-bucket: авто-создание
    # ключа и бакета из GARAGE_DEFAULT_* переменных. Инит-контейнер не нужен.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Секреты в env, а не в garage.toml, чтобы не хранить их в git.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      # Авто-создание ключа доступа и первого бакета (photos).
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_PHOTOS}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:9000:3900"
      - "127.0.0.1:9001:3902"
    restart: unless-stopped
    networks: [course-bot_net]
    healthcheck:
      # Образ dxflrs/garage — from scratch, /bin/sh нет.
      # Поэтому только exec-форма, вызываем сам бинарник /garage.
      # `garage status` читает /etc/garage.toml и подключается к локальному RPC.
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_GARAGE:-192M}

  # FastAPI backend. Заглушка до Итерации 0-А.
  # Развязан от S3: api стартует без garage — S3 нужен только с Итерации 5.
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: course-bot_api
    env_file:
      - ../.env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_API:-384M}

  # Telegram bot (aiogram 3). Заглушка до Итерации 0-А.
  bot:
    build:
      context: ../apps/bot
      dockerfile: Dockerfile
    container_name: course-bot_bot
    env_file:
      - ../.env
    environment:
      TZ: ${TZ}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_BOT:-192M}

  # Mini App (nginx с собранной статикой). Заглушка до Итерации 0-А.
  # Vite dev-режим (порт 5173) — только на dev-машине, не в этом compose.
  miniapp:
    build:
      context: ../apps/miniapp
      dockerfile: Dockerfile
    container_name: course-bot_miniapp
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_MINIAPP:-128M}

volumes:
  pgdata:
    name: course-bot_pgdata
  redis-data:
    name: course-bot_redis-data
  garage-meta:
    name: course-bot_garage-meta
  garage-data:
    name: course-bot_garage-data

networks:
  course-bot_net:
    name: course-bot_net
    driver: bridge
