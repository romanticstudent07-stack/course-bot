# infra/docker-compose.dev.yml
# Локальный контур разработки на сервере IRONCLAD (Ubuntu 26.04, bare-metal).
# Правила сервера:
#   - все порты биндятся на 127.0.0.1 (вход: dev — Tailscale serve, только tailnet,
#     смотрит на miniapp 127.0.0.1:5173; прод — позже через VPS, решение Автора).
#   - у всех контейнеров задан лимит памяти (переменные MEM_LIMIT_* в .env).
#   - префикс проекта course-bot — не пересекается с maxmover_default.
#   - shared_buffers Postgres ≤ 256 MB (правило хоста).
# НЕ для прода: в проде PostgreSQL с PITR и S3 у РФ-провайдера (Yandex Object Storage).
#
# Переменные окружения сервисов (B-3; D-24 = А, B-3d):
#   - У api, projector и bot НЕТ env_file: в их контейнеры попадают только переменные,
#     перечисленные в environment. Новая переменная этим сервисам — только явной
#     строкой в их environment (в .env одной её мало).
#   - api ходит в БД только по DATABASE_URL (роль app_api). POSTGRES_*, пароля владельца,
#     MIGRATIONS_DATABASE_URL, PROJECTOR_DATABASE_URL, WEBHOOK_SECRET, ключей S3 и GARAGE_*
#     у api нет. У числовых настроек — дефолты как в app/config.py (${VAR:-дефолт}):
#     пустая строка из ${VAR} перекрыла бы дефолт кода, а в int-поле сломала бы старт.
#   - projector ходит в БД только по PROJECTOR_DATABASE_URL (роль app_projector),
#     запасного пути к владельцу нет: пусто в .env → проектор без БД.
#   - Пароль владельца БД (MIGRATIONS_DATABASE_URL) есть только у одноразового сервиса
#     migrate (profiles: tools): alembic и python -m app.texts load, запуск только вручную.
#   - Подробности — infra/SERVER-IRONCLAD.md, разделы «Роли БД (B-3)»
#     и «Миграции и тексты (B-3d)».
#
# S3-совместимое хранилище — Garage (dxflrs/garage:v2.3.0), заменил MinIO
# (с октября 2025 бесплатных Docker-образов MinIO нет, 25.04.2026 репо minio/minio архивирован).
# Переезд на Yandex Object Storage — просто смена S3_ENDPOINT, код не меняется.
#
# ВАЖНО:
#   - Образ dxflrs/garage собран from scratch — в нём нет /bin/sh.
#     Поэтому healthcheck — только exec-форма ["CMD", "/garage", ...].
#   - Флаги --single-node и --default-bucket автоматически создают
#     кластер из одного узла и первый бакет (photos) из переменных
#     GARAGE_DEFAULT_* — init-контейнер не нужен.
#   - Второй бакет (audit) создаётся вручную одной командой при переходе
#     к Итерации 5 (см. infra/README.md, раздел "Создание бакета audit").

name: course-bot

services:
  db:
    image: postgres:16
    container_name: course-bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    command: >
      postgres -c wal_level=replica
               -c archive_mode=on
               -c max_wal_senders=3
               -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-384M}

  # Redis: счётчики rate-limit (B-1), данные на диск не пишутся (--save "", appendonly no).
  # healthcheck — redis-cli ping (infra-melochi): в ps статус healthy, а не просто Up.
  # api ждёт только старта redis (service_started): rate-limit fail-open, без Redis api работает.
  redis:
    image: redis:7-alpine
    container_name: course-bot_redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_REDIS:-64M}

  # S3-совместимое хранилище (замена MinIO).
  # Garage — Rust, крошечный (~30 MB RAM), актуальный (dxflrs/garage:v2.3.0).
  # Конфиг: infra/garage/garage.toml (примонтирован read-only).
  # Порты Garage: 3900 (S3 API), 3901 (RPC), 3902 (s3_web — раздача статики, НЕ админка), 3903 (Admin API).
  # Наружу публикуем как 9000/9001, чтобы схема портов в .env не менялась.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: course-bot_garage
    # --single-node: один узел без реплик; --default-bucket: авто-создание
    # ключа и бакета из GARAGE_DEFAULT_* переменных. Инит-контейнер не нужен.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Секреты в env, а не в garage.toml, чтобы не хранить их в git.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      # Авто-создание ключа доступа и первого бакета (photos).
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_PHOTOS}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:9000:3900"
      - "127.0.0.1:9001:3902"
    restart: unless-stopped
    networks: [course-bot_net]
    healthcheck:
      # Образ dxflrs/garage — from scratch, /bin/sh нет.
      # Поэтому только exec-форма, вызываем сам бинарник /garage.
      # `garage status` читает /etc/garage.toml и подключается к локальному RPC.
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_GARAGE:-192M}

  # FastAPI backend: /healthz, /miniapp/v1/** (проверка initData, rate-limit B-1,
  # онбординг, тексты), /security/csp-report.
  # Развязан от S3: api стартует без garage — S3 нужен только с Итерации 5.
  # env_file нет (B-3d, D-24 = А): только переменные ниже. Пароля владельца БД нет;
  # без DATABASE_URL api к БД не подключится (безопасный отказ, 503).
  # Поля config.py, которых нет в .env.example (RATE_LIMIT_REDIS_TIMEOUT_SECONDS,
  # INIT_DATA_SENSITIVE_MAX_AGE_SECONDS, INIT_DATA_FUTURE_SKEW_SECONDS,
  # POSTGRES_PORT_INTERNAL), не передаются — действует дефолт кода.
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: course-bot_api
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_PHOTOS: ${S3_BUCKET_PHOTOS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
      DAY_TEST_ENTRY_ENABLED: ${DAY_TEST_ENTRY_ENABLED:-false}
      SERVER_TIMEZONE: ${SERVER_TIMEZONE:-Europe/Moscow}
      POSTGRES_HOST_INTERNAL: ${POSTGRES_HOST_INTERNAL:-db}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_API:-384M}

  # Одноразовый сервис миграций (B-3d, D-24 = А). Тот же образ, что у api (apps/api).
  # Единственный контейнер с паролем владельца БД (MIGRATIONS_DATABASE_URL).
  # profiles: tools → не стартует при up -d и после перезагрузки сервера; только вручную
  # (DC = docker compose --env-file .env -f infra/docker-compose.dev.yml):
  #   DC build migrate && DC run --rm migrate          — alembic upgrade head
  #   DC run --rm migrate python -m app.texts load     — загрузка текстов
  # env_file, restart, портов и container_name нет. HTTP нет → healthcheck образа отключён.
  # ALEMBIC_CONFIG берётся из ENV образа (apps/api/Dockerfile).
  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: ${MIGRATIONS_DATABASE_URL}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_MIGRATE:-128M}

  # Проектор (E1): единственный писатель participant_state.
  # Тот же образ, что у api (apps/api), другая команда: python -m app.projector run
  # (цикл 1 с; сбой БД → WARNING, пауза 5 с, повтор — контейнер не падает).
  # HTTP нет → портов нет; HEALTHCHECK Dockerfile api стучится на /healthz — отключён.
  # env_file нет (B-3): из настроек проектору нужны только DSN и уровень лога.
  projector:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: course-bot_projector
    command: ["python", "-m", "app.projector", "run"]
    environment:
      PROJECTOR_DATABASE_URL: ${PROJECTOR_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_PROJECTOR:-128M}

  # Telegram bot (aiogram 3: /start + Menu Button; long polling, D-4).
  # env_file нет (B-3): бот читает только BOT_TOKEN, WEBAPP_URL, LOG_LEVEL (bot/config.py);
  # БД и Redis бот не использует.
  bot:
    build:
      context: ../apps/bot
      dockerfile: Dockerfile
    container_name: course-bot_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_BOT:-512M}

  # Mini App (nginx с собранной статикой React + Vite). Единый origin:
  # nginx сам проксирует /miniapp/v1/** и /security/csp-report в api:8080.
  # Vite dev-режим (порт 5173) — только на dev-машине, не в этом compose.
  miniapp:
    build:
      context: ../apps/miniapp
      dockerfile: Dockerfile
    container_name: course-bot_miniapp
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_MINIAPP:-128M}

volumes:
  pgdata:
    name: course-bot_pgdata
  redis-data:
    name: course-bot_redis-data
  garage-meta:
    name: course-bot_garage-meta
  garage-data:
    name: course-bot_garage-data

networks:
  course-bot_net:
    name: course-bot_net
    driver: bridge
