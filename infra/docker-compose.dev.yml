# Локальный контур разработки на сервере IRONCLAD (Ubuntu 26.04, bare-metal).
# Правила сервера:
#   - все порты биндятся на 127.0.0.1 (наружу — только Cloudflare Tunnel).
#   - у всех контейнеров задан лимит памяти (переменные MEM_LIMIT_* в .env).
#   - префикс проекта course-bot — не пересекается с maxmover_default.
#   - shared_buffers Postgres ≤ 256 MB (правило хоста).
# НЕ для прода: в проде PostgreSQL с PITR и S3 у РФ-провайдера (Yandex Object Storage).
#
# S3-совместимое хранилище — Garage (dxflrs/garage), заменил MinIO
# (MinIO удалил официальные Docker-образы в сентябре 2026).
# Переезд на Yandex Object Storage — просто смена S3_ENDPOINT, код не меняется.

name: course-bot

services:
  db:
    image: postgres:16
    container_name: course-bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    command: >
      postgres -c wal_level=replica
               -c archive_mode=on
               -c max_wal_senders=3
               -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-384M}

  redis:
    image: redis:7-alpine
    container_name: course-bot_redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_REDIS:-64M}

  # S3-совместимое хранилище (замена MinIO).
  # Garage — Rust, крошечный (~30MB RAM), актуальный (dxflrs/garage:v2.1.0).
  # Конфиг: infra/garage/garage.toml (примонтирован read-only).
  # Порты Garage: 3900 (S3 API), 3901 (RPC), 3902 (Admin/Web UI).
  # Наружу публикуем как 9000/9001, чтобы схема портов в .env не менялась.
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: course-bot_garage
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ../infra/garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:9000:3900"
      - "127.0.0.1:9001:3902"
    restart: unless-stopped
    networks: [course-bot_net]
    healthcheck:
      # Garage отдаёт 200 на / (S3 root) — используем для healthcheck.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3900/ || exit 1"]
      interval: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_MINIO:-192M}

  # Одноразовый init: инициализирует кластер Garage (один узел),
  # создаёт бакеты photos/audit и ключ, значения которого совпадают с .env.
  # См. infra/garage/init.sh — реальный скрипт (примонтирован read-only).
  garage-init:
    image: dxflrs/garage:v2.1.0
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ../infra/garage/init.sh:/init.sh:ro
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PHOTOS: ${S3_BUCKET_PHOTOS}
      S3_BUCKET_AUDIT: ${S3_BUCKET_AUDIT}
    networks: [course-bot_net]
    restart: "no"

  # FastAPI backend. Заглушка до Итерации 0-А.
  # Развязан от S3: api стартует без garage — S3 нужен только с Итерации 5.
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: course-bot_api
    env_file:
      - ../.env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_API:-384M}

  # Telegram bot (aiogram 3). Заглушка до Итерации 0-А.
  bot:
    build:
      context: ../apps/bot
      dockerfile: Dockerfile
    container_name: course-bot_bot
    env_file:
      - ../.env
    environment:
      TZ: ${TZ}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_BOT:-192M}

  # Mini App (nginx с собранной статикой). Заглушка до Итерации 0-А.
  # Vite dev-режим (порт 5173) — только на dev-машине, не в этом compose.
  miniapp:
    build:
      context: ../apps/miniapp
      dockerfile: Dockerfile
    container_name: course-bot_miniapp
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    networks: [course-bot_net]
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
    name: course-bot_pgdata
  redis-data:
    name: course-bot_redis-data
  garage-meta:
    name: course-bot_garage-meta
  garage-data:
    name: course-bot_garage-data

networks:
  course-bot_net:
    name: course-bot_net
    driver: bridge
